<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HRD Анна Ермакова — HR-услуги для компаний</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#111b31;
      --muted:#9fb0d0;
      --text:#eaf1ff;
      --brand:#6ae4ff;
      --brand2:#7c5cff;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
      --ring: 0 0 0 4px rgba(106,228,255,.18);
      --radius: 18px;
      --radius2: 24px;
      --max: 1120px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(124,92,255,.35), transparent 55%),
        radial-gradient(700px 450px at 90% 10%, rgba(106,228,255,.30), transparent 55%),
        radial-gradient(500px 380px at 40% 110%, rgba(61,255,155,.18), transparent 55%),
        var(--bg);
      color:var(--text);
      line-height:1.4;
    }
    a{color:inherit; text-decoration:none}
    .container{width: min(var(--max), calc(100% - 32px)); margin: 0 auto;}

    header{
      position: sticky;
      top:0;
      z-index:50;
      backdrop-filter: blur(10px);
      background: rgba(11,18,32,.55);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .nav{
      display:flex; align-items:center; justify-content:space-between;
      padding: 14px 0; gap:12px;
    }
    .logo{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.2px}
    .mark{
      width:36px; height:36px; border-radius: 12px;
      background: linear-gradient(135deg, rgba(106,228,255,.95), rgba(124,92,255,.95));
      box-shadow: 0 10px 30px rgba(106,228,255,.18);
      position:relative;
    }
    .mark:after{
      content:"";
      position:absolute; inset: 9px 8px 8px 10px;
      border-radius: 10px;
      border:2px solid rgba(255,255,255,.6);
      transform: rotate(8deg);
      opacity:.7;
    }

    .navlinks{display:flex; gap:18px; align-items:center; flex-wrap:wrap;}
    .navlinks a{
      color: rgba(234,241,255,.78);
      font-size:14px;
      padding:10px 10px;
      border-radius: 12px;
      transition: .2s ease;
    }
    .navlinks a:hover{background: rgba(255,255,255,.06); color: rgba(234,241,255,1);}

    .cta{display:flex; gap:10px; align-items:center;}
    .btn{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 14px;
      font-weight:800;
      font-size:14px;
      transition: .2s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      cursor:pointer;
      user-select:none;
    }
    .btn:hover{transform: translateY(-1px); border-color: rgba(255,255,255,.20)}
    .btn:active{transform: translateY(0px)}
    .btn.primary{
      border: none;
      background: linear-gradient(135deg, rgba(106,228,255,1), rgba(124,92,255,1));
      box-shadow: 0 18px 60px rgba(124,92,255,.25);
      color:#06101f;
    }
    .btn.primary:hover{filter: brightness(1.02)}

    .hero{padding: 58px 0 26px;}
    .grid-hero{display:grid; grid-template-columns: 1.1fr .9fr; gap: 22px; align-items: start;}
    @media (max-width: 980px){ .grid-hero{grid-template-columns: 1fr;} .navlinks{display:none} }

    .pill{
      display:inline-flex; gap:10px; align-items:center;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255
