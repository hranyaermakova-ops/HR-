<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HRD Анна Ермакова — HR-услуги для компаний</title>
  <style>
    :root{
      --bg: #f7f4f0; /* Теплый мягкий серо-кремовый */
      --card: #ffffff; /* Белоснежные карточки */
      --muted: #8d8580; /* Теплый серый для второстепенного текста */
      --text: #2f2a28; /* Глубокий кофейно-серый для отличной читаемости */
      --brand: #d4af37; /* Благородное золото */
      --brand-hover: #c5a059; /* Темное золото при наведении */
      --pink-soft: #ffe5ec; /* Нежнейший пушистый розовый */
      --pink-accent: #ffccd5; /* Чуть более насыщенный розовый */
      --shadow: 0 20px 40px rgba(184, 165, 153, 0.12); /* Мягкие пушистые тени */
      --ring: 0 0 0 4px rgba(212, 175, 55, 0.15);
      --radius: 18px;
      --radius2: 24px;
      --max: 1120px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(255, 204, 213, 0.45), transparent 60%), /* Нежно-розовое пушистое свечение */
        radial-gradient(700px 450px at 90% 10%, rgba(212, 175, 55, 0.15), transparent 60%), /* Золотистое мерцание */
        radial-gradient(500px 380px at 40% 110%, rgba(255, 229, 236, 0.5), transparent 60%),
        var(--bg);
      color:var(--text);
      line-height:1.4;
    }
    a{color:inherit; text-decoration:none}
    .container{width: min(var(--max), calc(100% - 32px)); margin: 0 auto;}

    header{
      position: sticky;
      top:0;
      z-index:50;
      backdrop-filter: blur(10px);
      background: rgba(247, 244, 240, 0.75);
      border-bottom: 1px solid rgba(184, 165, 153, 0.15);
    }
    .nav{
      display:flex; align-items:center; justify-content:space-between;
      padding: 14px 0; gap:12px;
    }
    .logo{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.2px}
    .mark{
      width:36px; height:36px; border-radius: 12px;
